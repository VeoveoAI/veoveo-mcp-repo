[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-repo"
publish = false

[workspace.dependencies]
# veoveo-core, pinned to one revision for every core crate.
veoveo-skills = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration and the forwarded identity.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "18a6e8c5f8a69ca57a6e12f8b752203574efa231", default-features = false }
# The App's look and its gallery.
veoveo-hub-ui = { git = "https://github.com/VeoveoAI/veoveo-hub-ui", rev = "632e0fb479f9e62889d8c99f40bda79aeb1b60e9" }
# The Thumb server's contract, for pictures of files. It pins this SDK revision, so the two move together.
veoveo-mcp-thumb = { git = "https://github.com/VeoveoAI/veoveo-mcp-thumb", rev = "b81219559132590fdb9f50d5771881088d32d5ca", default-features = false }

anyhow = "=1.0.104"
axum = { version = "0.8.9", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Unified diffs of text files, as Lore's own client makes them: Lore's ContentDiff is not implemented.
diffy = "=0.5.2"
dotenvy = "0.15.7"
futures = "0.3.34"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.11.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "1e7caf018db7eb3bed2e81023e10fc0ce58af8a5" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tempfile = "=3.27.0"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
